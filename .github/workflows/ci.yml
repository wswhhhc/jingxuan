name: 持续集成

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  api-contract:
    name: API 契约一致性
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: 配置 Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: 安装固定版本的 OpenAPI 校验依赖
        run: python -m pip install --disable-pip-version-check --no-cache-dir "PyYAML==6.0.2"

      - name: 配置 JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: 配置 Node.js 24.14.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm --prefix frontend ci --legacy-peer-deps

      - name: 校验 OpenAPI 与生成客户端一致
        run: npm run api:check

  frontend-quality:
    name: 前端质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: 配置 JDK 21 以校验统一工具链
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: temurin

      - name: 配置 Node.js 24.14.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 校验 npm 版本
        run: npm run verify:toolchain

      - name: 安装前端依赖
        run: npm --prefix frontend ci

      - name: 检查根工作区配置格式
        run: npm run format:check

      - name: 检查前端代码规范
        run: npm run frontend:lint

      - name: 检查前端类型
        run: npm run frontend:typecheck

      - name: 执行前端单元测试
        run: |
          mkdir -p frontend/test-results
          npm --prefix frontend run test -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml

      - name: 保存前端失败测试报告
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 前端测试报告-${{ github.sha }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 构建前端生产制品
        run: npm run frontend:build

      - name: 审计前端生产依赖
        run: npm run frontend:audit

      - name: 保存前端构建制品
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 前端构建-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  backend-quality:
    name: 后端质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: 配置 JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: 配置 Node.js 24.14.1 以运行根工作区命令
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1

      - name: 执行后端单元与集成验证
        run: npm run backend:verify

      - name: 保存后端失败测试报告
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 后端测试报告-${{ github.sha }}
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: 保存后端构建制品
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 后端构建-${{ github.sha }}
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  legacy-runtime-smoke:
    name: Legacy Docker 运行时冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: jingxuan-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DB_USER: jingxuan
      DB_NAME: jingxuan
      SMOKE_MODE: full
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: 配置 Node.js 24.14.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1

      - name: 校验 Legacy 冒烟契约
        run: npm run smoke:test

      - name: 生成一次性测试凭据
        shell: bash
        run: |
          node - <<'NODE'
          const { appendFileSync } = require("node:fs");
          const { randomBytes } = require("node:crypto");
          const values = {
            DB_ROOT_PASSWORD: randomBytes(24).toString("hex"),
            DB_LEGACY_ROOT_PASSWORD: randomBytes(24).toString("hex"),
            DB_PASSWORD: randomBytes(24).toString("hex"),
            // JwtTokenProvider 使用标准 Base64 解码，不能生成 Base64URL 密钥。
            JWT_SECRET: randomBytes(48).toString("base64"),
          };
          for (const value of Object.values(values)) {
            process.stdout.write(`::add-mask::${value}\n`);
          }
          appendFileSync(
            process.env.GITHUB_ENV,
            Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(""),
          );
          NODE

      - name: 初始化旧版 MySQL 卷
        shell: bash
        run: |
          set -euo pipefail
          legacy_container="${COMPOSE_PROJECT_NAME}-legacy-mysql"

          # 先由 Compose 创建带正确标签的卷，再用旧配置（仅 root 账号）写入历史 Schema。
          docker compose create mysql >/dev/null
          docker compose rm --force mysql >/dev/null
          docker run --detach \
            --name "$legacy_container" \
            --env MYSQL_ROOT_PASSWORD="$DB_LEGACY_ROOT_PASSWORD" \
            --env MYSQL_DATABASE="$DB_NAME" \
            --volume "${COMPOSE_PROJECT_NAME}_mysql-data:/var/lib/mysql" \
            mysql:8.0.46 >/dev/null

          ready=false
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            if docker exec "$legacy_container" \
              mysqladmin ping --host=127.0.0.1 --silent >/dev/null 2>&1; then
              ready=true
              break
            fi
            state="$(docker inspect --format '{{.State.Status}}' "$legacy_container")"
            if [[ "$state" == "exited" || "$state" == "dead" ]]; then
              docker logs "$legacy_container"
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "旧版 MySQL 未在 120 秒内就绪" >&2
            exit 1
          fi

          node - <<'NODE' | docker exec -i -e MYSQL_PWD="$DB_LEGACY_ROOT_PASSWORD" \
            "$legacy_container" mysql --user=root "$DB_NAME"
          const { readFileSync } = require("node:fs");
          const path = require("node:path");
          const source = readFileSync(
            "backend/src/main/java/db/migration/V1__Baseline.java",
            "utf8",
          );
          const scripts = [...source.matchAll(/"(legacy-sql\/[^"]+\.sql)"/g)]
            .map((match) => match[1]);
          if (scripts.length !== 14) {
            throw new Error("Flyway V1 legacy SQL 数量异常");
          }
          for (const script of scripts) {
            process.stdout.write(
              readFileSync(
                path.join("backend/src/main/resources", script),
                "utf8",
              ),
            );
            process.stdout.write("\n");
          }
          NODE

          docker exec -e MYSQL_PWD="$DB_LEGACY_ROOT_PASSWORD" "$legacy_container" \
            mysql --user=root "$DB_NAME" --execute \
            "CREATE TABLE IF NOT EXISTS legacy_ci_sentinel (
              id INT PRIMARY KEY,
              marker VARCHAR(64) NOT NULL
            );
            INSERT INTO legacy_ci_sentinel (id, marker)
            VALUES (1, 'preserved-before-migration')
            ON DUPLICATE KEY UPDATE marker = VALUES(marker);"

          docker stop --time 30 "$legacy_container" >/dev/null
          docker rm "$legacy_container" >/dev/null

      - name: 构建并启动 Legacy 运行时
        run: docker compose up -d --build mysql redis backend

      - name: 有界等待后端启动
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 240))
          while (( SECONDS < deadline )); do
            backend_id="$(docker compose ps -q backend)"
            if [[ -n "$backend_id" ]]; then
              status="$(docker inspect --format '{{.State.Status}}' "$backend_id")"
              restarting="$(docker inspect --format '{{.State.Restarting}}' "$backend_id")"
              echo "backend State.Status=$status State.Restarting=$restarting"
              if [[ "$status" == "running" ]] && curl --fail --silent --show-error \
                --max-time 5 "http://127.0.0.1:8080/api/public/works?page=1&size=1" >/dev/null; then
                exit 0
              fi
              if [[ "$restarting" == "true" || "$status" == "exited" || "$status" == "dead" ]]; then
                exit 1
              fi
            fi
            sleep 3
          done
          echo "后端未在 240 秒内就绪" >&2
          exit 1

      - name: 验证旧卷迁移与密码轮换
        shell: bash
        run: |
          set -euo pipefail
          marker="$(docker compose exec -T -e MYSQL_PWD="$DB_PASSWORD" mysql \
            mysql --user="$DB_USER" "$DB_NAME" -Nse \
            "SELECT marker FROM legacy_ci_sentinel WHERE id = 1")"
          if [[ "$marker" != "preserved-before-migration" ]]; then
            echo "应用账号无法读取旧卷数据" >&2
            exit 1
          fi

          echo "验证旧 root 密码必须失效"
          if docker compose exec -T -e MYSQL_PWD="$DB_LEGACY_ROOT_PASSWORD" mysql \
            mysql --user=root "$DB_NAME" -Nse "SELECT 1" >/dev/null 2>&1; then
            echo "旧 root 密码仍可登录" >&2
            exit 1
          fi
          docker compose exec -T -e MYSQL_PWD="$DB_ROOT_PASSWORD" mysql \
            mysql --user=root "$DB_NAME" -Nse "SELECT 1" | grep -qx "1"

      - name: 验证 Flyway 基线与运行时表
        shell: bash
        run: |
          set -euo pipefail
          versions="$(docker compose exec -T -e MYSQL_PWD="$DB_ROOT_PASSWORD" mysql \
            mysql -u root "$DB_NAME" -Nse "SELECT version FROM flyway_schema_history WHERE success = 1 AND version IN ('1','2') ORDER BY installed_rank")"
          grep -qx "1" <<< "$versions"
          grep -qx "2" <<< "$versions"
          docker compose exec -T -e MYSQL_PWD="$DB_ROOT_PASSWORD" mysql \
            mysql -u root "$DB_NAME" -Nse "SHOW TABLES LIKE 'sys_user'" | grep -qx "sys_user"
          docker compose exec -T -e MYSQL_PWD="$DB_ROOT_PASSWORD" mysql \
            mysql -u root "$DB_NAME" -Nse "SHOW TABLES LIKE 'EVENT_PUBLICATION'" | grep -qx "EVENT_PUBLICATION"

      - name: 装载隔离 fixture
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T redis redis-cli FLUSHDB >/dev/null
          {
            echo "START TRANSACTION;"
            cat backend/src/test/resources/sql/cleanup.sql
            cat backend/src/test/resources/sql/test-data.sql
            echo "COMMIT;"
          } | docker compose exec -T -e MYSQL_PWD="$DB_ROOT_PASSWORD" mysql \
            mysql -u root "$DB_NAME"

      - name: 执行全角色 Legacy 冒烟
        run: npm run smoke:legacy

      - name: 收集脱敏失败日志
        if: failure()
        shell: bash
        run: |
          echo "DB_ROOT_PASSWORD、DB_LEGACY_ROOT_PASSWORD、DB_PASSWORD 与 JWT_SECRET 已脱敏，以下仅输出容器状态和日志。"
          docker compose ps
          {
            docker compose logs --no-color mysql mysql-user-bootstrap redis backend || true
            backend_id="$(docker compose ps -a -q backend)"
            if [[ -n "$backend_id" ]]; then
              docker inspect --format 'backend State.Status={{.State.Status}} State.ExitCode={{.State.ExitCode}} State.OOMKilled={{.State.OOMKilled}}' "$backend_id" || true
              backend_log_dir="$RUNNER_TEMP/backend-file-logs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              mkdir -p "$backend_log_dir"
              if docker cp "${backend_id}:/app/logs/." "$backend_log_dir/" >/dev/null 2>&1; then
                while IFS= read -r -d '' log_file; do
                  echo "===== 后端文件日志: $(basename "$log_file") ====="
                  tail -n 200 "$log_file"
                done < <(find "$backend_log_dir" -type f -print0)
              fi
            fi
            legacy_container="${COMPOSE_PROJECT_NAME}-legacy-mysql"
            if docker inspect "$legacy_container" >/dev/null 2>&1; then
              docker logs "$legacy_container" || true
            fi
          } 2>&1 | node -e '
            let output = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { output += chunk; });
            process.stdin.on("end", () => {
              for (const key of ["DB_ROOT_PASSWORD", "DB_LEGACY_ROOT_PASSWORD", "DB_PASSWORD", "JWT_SECRET"]) {
                const secret = process.env[key] ?? "";
                if (secret) output = output.split(secret).join("[已脱敏]");
              }
              process.stdout.write(output);
            });
          '

      - name: 销毁 Legacy 运行时与卷
        if: always()
        shell: bash
        run: |
          docker rm --force "${COMPOSE_PROJECT_NAME}-legacy-mysql" >/dev/null 2>&1 || true
          docker compose down --volumes --remove-orphans

  security-quality:
    name: 安全基线门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出完整提交历史
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 Node.js 24.14.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1

      - name: 检查环境文件与 JWT 配置
        run: npm run verify:config

      - name: 安装固定版本的 Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: 扫描提交历史中的秘密
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

      - name: 扫描严重依赖与配置漏洞
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-dirs: frontend/node_modules,frontend/dist,backend/target

  dependency-review:
    name: 拉取请求依赖审查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: 审查新增依赖风险
        uses: actions/dependency-review-action@40c09b7dc99638e5ddb0bfd91c1673effc064d8a # v4.8.1
        with:
          fail-on-severity: high
