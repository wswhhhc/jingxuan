server:
  port: 8080

spring:
  application:
    name: jingxuan-backend
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 1536MB
      max-request-size: 1600MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 1

mybatis-plus:
  type-aliases-package: com.jingxuan.entity
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Spring Security 忽略路径（无需认证）
ignored:
  paths: /auth/login,/api/auth/login,/api/v1/auth/login,/api/v1/auth/refresh,/auth/register,/api/auth/register,/auth/send-code,/api/auth/send-code,/api/v1/classes,/api/v1/dictionaries/**,/api/v1/tags,/swagger-ui/**,/v3/api-docs/**,/doc.html,/webjars/**,/favicon.ico,/uploads/**,/public/**,/comment/list/**

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}  # 24小时
  v1-access-expiration: ${JWT_V1_ACCESS_EXPIRATION_MS:900000}  # v1 access token 15分钟

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# DeepSeek 内容审核
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-v4-flash
  timeout: 30000
  fallback: reject  # reject | warning | review

# 文件上传路径
jingxuan:
  upload:
    path: ${JINGXUAN_UPLOAD_PATH:./uploads}
