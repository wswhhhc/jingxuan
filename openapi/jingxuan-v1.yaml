components:
  schemas:
    LoginRequest:
      description: 登录请求
      properties:
        challengeAnswer:
          description: 登录风控要求 challenge 时填写的答案
          example: 7
          format: int32
          maximum: 100
          minimum: 0
          type: integer
        challengeId:
          description: 登录风控要求 challenge 时填写的 ID
          example: AAAAAAAAAAAAAAAAAAAAAA
          pattern: "[A-Za-z0-9_-]{22}"
          type: string
        password:
          description: 密码
          example: ExamplePass2026
          minLength: 1
          type: string
        rememberMe:
          description: 记住登录状态（30天）
          example: false
          type: boolean
        username:
          description: 用户名
          example: student001
          minLength: 1
          type: string
      required:
        - password
        - username
      type: object
    ProblemDetails:
      description: 统一 API 错误响应
      properties:
        code:
          description: 机器可读业务错误码
          type: string
        detail:
          description: 面向用户的错误详情
          type: string
        fieldErrors:
          additionalProperties:
            description: 字段校验错误
            type: string
          description: 字段校验错误
          type: object
        instance:
          description: 请求实例 URI
          format: uri-reference
          type: string
        requestId:
          description: 请求追踪 ID
          type: string
        status:
          description: HTTP 状态码
          format: int32
          type: integer
        title:
          description: 问题标题
          type: string
        type:
          description: 问题类型 URI
          format: uri
          type: string
      required:
        - code
        - detail
        - instance
        - requestId
        - status
        - title
        - type
      type: object
    ScoreSubmitRequest:
      description: 评分提交请求
      properties:
        comment:
          description: 教师评语
          type: string
        completion:
          description: 完成度（满分30）
          maximum: 30
          minimum: 0
          type: number
        difficulty:
          description: 技术难度（满分25）
          maximum: 25
          minimum: 0
          type: number
        innovation:
          description: 创新性（满分25）
          maximum: 25
          minimum: 0
          type: number
        practicality:
          description: 实用性（满分20）
          maximum: 20
          minimum: 0
          type: number
        workId:
          description: 作品ID
          type: string
      required:
        - completion
        - difficulty
        - innovation
        - practicality
        - workId
      type: object
    V1AuditDecisionRequest:
      properties:
        decision:
          minLength: 1
          type: string
        reason:
          maxLength: 500
          minLength: 0
          type: string
      required:
        - decision
      type: object
    V1Batch:
      properties:
        endAt:
          type: string
        id:
          type: string
        name:
          type: string
        rankPublished:
          type: boolean
        startAt:
          type: string
        status:
          type: string
      type: object
    V1ChallengeRequest:
      description: 创建一次性算术 challenge 请求
      properties:
        purpose:
          description: challenge 用途
          enum:
            - LOGIN
            - GUEST_COMMENT
          example: LOGIN
          type: string
      required:
        - purpose
      type: object
    V1ChallengeResponse:
      description: 一次性算术 challenge；答案仅保存在服务端
      properties:
        expiresIn:
          description: 剩余有效时间（秒）
          example: 300
          format: int64
          type: integer
        id:
          description: 128-bit URL-safe challenge ID
          example: AAAAAAAAAAAAAAAAAAAAAA
          type: string
        question:
          description: 简单加减法题目
          example: 3 + 4 = ?
          type: string
      type: object
    V1CompleteTaskRequest:
      properties:
        workId:
          minLength: 1
          pattern: "[0-9]{1,19}"
          type: string
      required:
        - workId
      type: object
    V1CreateCommentRequest:
      properties:
        content:
          maxLength: 1000
          minLength: 0
          type: string
        guestName:
          maxLength: 50
          minLength: 0
          type: string
        parentId:
          pattern: "[0-9]{1,19}"
          type: string
      required:
        - content
      type: object
    V1CreatedComment:
      properties:
        id:
          type: string
      type: object
    V1CreatedDeletionRequest:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    V1CreatedWork:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    V1CreateWorkRequest:
      properties:
        advisor:
          type: string
        attachmentIds:
          items:
            pattern: "[0-9]{1,19}"
            type: string
          type: array
        batchId:
          pattern: "[0-9]{1,19}"
          type: string
        coverUrl:
          type: string
        members:
          items:
            $ref: "#/components/schemas/WorkMemberDTO"
          type: array
        previewUrl:
          type: string
        runDescription:
          type: string
        summary:
          type: string
        techStack:
          type: string
        title:
          maxLength: 200
          minLength: 0
          type: string
      required:
        - title
      type: object
    V1DeleteRequest:
      properties:
        reason:
          maxLength: 500
          minLength: 0
          type: string
      required:
        - reason
      type: object
    V1DeletionImpact:
      properties:
        referenceCount:
          format: int64
          type: integer
        references:
          items:
            type: string
          type: array
        resourceId:
          type: string
        resourceType:
          type: string
      type: object
    V1EmailVerificationRequest:
      properties:
        email:
          format: email
          minLength: 1
          type: string
        roleId:
          pattern: 1|2
          type: string
      required:
        - email
        - roleId
      type: object
    V1FeaturedRequest:
      properties:
        featured:
          type: boolean
        previewUrl:
          type: string
      required:
        - featured
      type: object
    V1LoginResponse:
      properties:
        accessToken:
          type: string
        expiresIn:
          format: int64
          type: integer
        tokenType:
          type: string
        user:
          $ref: "#/components/schemas/V1UserInfo"
      required:
        - accessToken
        - expiresIn
        - tokenType
        - user
      type: object
    V1ReferenceItem:
      properties:
        id:
          type: string
        label:
          type: string
        sort:
          format: int32
          type: integer
        type:
          type: string
        value:
          type: string
      type: object
    V1RegistrationRequest:
      properties:
        classId:
          type: string
        email:
          format: email
          minLength: 1
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
        realName:
          maxLength: 64
          minLength: 0
          type: string
        roleId:
          pattern: 1|2
          type: string
        username:
          maxLength: 64
          minLength: 0
          type: string
        verifyCode:
          minLength: 1
          pattern: "[0-9]{6}"
          type: string
      required:
        - email
        - password
        - realName
        - roleId
        - username
        - verifyCode
      type: object
    V1SubmitWorkRequest:
      properties:
        taskId:
          pattern: "[0-9]{1,19}"
          type: string
      type: object
    V1Tag:
      properties:
        color:
          type: string
        id:
          type: string
        name:
          type: string
        sort:
          format: int32
          type: integer
        type:
          type: string
      type: object
    V1TagRequest:
      properties:
        color:
          pattern: "#[0-9A-Fa-f]{6}"
          type: string
        name:
          maxLength: 64
          minLength: 0
          type: string
        sort:
          format: int32
          type: integer
        type:
          minLength: 1
          pattern: "[A-Za-z0-9_-]{1,64}"
          type: string
      required:
        - name
        - type
      type: object
    V1Task:
      properties:
        batchId:
          type: string
        batchName:
          type: string
        content:
          type: string
        endAt:
          type: string
        id:
          type: string
        status:
          type: string
        title:
          type: string
        workId:
          type: string
      type: object
    V1UpdateWorkRequest:
      properties:
        advisor:
          type: string
        attachmentIds:
          items:
            pattern: "[0-9]{1,19}"
            type: string
          type: array
        coverUrl:
          type: string
        members:
          items:
            $ref: "#/components/schemas/WorkMemberDTO"
          type: array
        previewUrl:
          type: string
        runDescription:
          type: string
        summary:
          type: string
        techStack:
          type: string
        title:
          maxLength: 200
          minLength: 0
          type: string
      type: object
    V1UserApprovalDecisionRequest:
      properties:
        decision:
          pattern: APPROVED|REJECTED
          type: string
        reason:
          maxLength: 500
          minLength: 0
          type: string
      type: object
    V1UserDeletionImpact:
      properties:
        deletionBlocked:
          type: boolean
        referenceCount:
          format: int64
          type: integer
        references:
          items:
            type: string
          type: array
        resourceId:
          type: string
        resourceType:
          type: string
      type: object
    V1UserInfo:
      properties:
        avatar:
          type: string
        classId:
          type: string
        className:
          type: string
        email:
          type: string
        firstLogin:
          type: boolean
        id:
          type: string
        phone:
          type: string
        realName:
          type: string
        roleCode:
          type: string
        roleId:
          type: string
        roleName:
          type: string
        username:
          type: string
      type: object
    V1WorkAttachment:
      properties:
        category:
          type: string
        contentType:
          type: string
        fileName:
          type: string
        id:
          type: string
        size:
          format: int64
          type: integer
        url:
          type: string
      type: object
    V1WorkDetail:
      properties:
        advisor:
          type: string
        attachments:
          items:
            $ref: "#/components/schemas/V1WorkAttachment"
          type: array
        averageScore:
          type: string
        batchId:
          type: string
        coverUrl:
          type: string
        featured:
          type: boolean
        id:
          type: string
        likeCount:
          format: int32
          type: integer
        liked:
          type: boolean
        members:
          items:
            $ref: "#/components/schemas/V1WorkMember"
          type: array
        previewUrl:
          type: string
        publicationStatus:
          type: string
        rank:
          format: int32
          type: integer
        runDescription:
          type: string
        status:
          type: string
        submittedAt:
          type: string
        submitterId:
          type: string
        submitterName:
          type: string
        summary:
          type: string
        tags:
          items:
            type: string
          type: array
        techStack:
          type: string
        title:
          type: string
        videoUrl:
          type: string
        viewCount:
          format: int32
          type: integer
      type: object
    V1WorkMember:
      properties:
        avatarUrl:
          type: string
        className:
          type: string
        id:
          type: string
        leader:
          type: boolean
        name:
          type: string
        studentId:
          type: string
        studentNumber:
          type: string
      type: object
    V1WorkSummary:
      properties:
        batchId:
          type: string
        id:
          type: string
        status:
          type: string
        submittedAt:
          type: string
        submitterId:
          type: string
        submitterName:
          type: string
        summary:
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          type: string
      type: object
    WorkMemberDTO:
      description: 作品成员信息
      properties:
        avatar:
          description: 用户头像URL（来自 SysUser）
          type: string
        className:
          description: 班级名称
          minLength: 1
          type: string
        id:
          description: 成员ID（编辑时传入）
          type: string
        isLeader:
          description: 是否队长 0=否 1=是
          format: int32
          type: integer
        studentId:
          description: 学生用户ID（已注册用户）
          type: string
        studentName:
          description: 学生姓名
          minLength: 1
          type: string
        studentNo:
          description: 学号
          minLength: 1
          type: string
      required:
        - className
        - studentName
        - studentNo
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: "输入 Bearer Token，格式: Bearer {token}"
      scheme: bearer
      type: http
info:
  contact:
    email: dev@example.com
    name: 开发团队
  description: 学院作品展示平台后端接口文档
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: 学院作品展示平台 API 文档
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/auth/challenges:
    post:
      operationId: challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V1ChallengeRequest"
        required: true
      responses:
        "201":
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/V1ChallengeResponse"
          description: challenge 已创建；答案仅保存在服务端
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求格式或参数类型错误
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求参数校验失败
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: challenge 发行限流
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 服务器内部错误
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: challenge 或限流存储不可用
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未单独列出的错误响应
      security: []
      summary: 创建一次性算术 challenge
      tags:
        - v1 认证
  /api/v1/auth/email-verifications:
    post:
      operationId: sendEmailVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V1EmailVerificationRequest"
        required: true
      responses:
        "204":
          description: 验证码已发送
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求格式或参数类型错误
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求参数校验失败
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 邮箱或地址请求超限
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 服务器内部错误
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 限流存储不可用
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未单独列出的错误响应
      security: []
      summary: 发送注册邮箱验证码
      tags:
        - v-1-registration-controller
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/V1LoginResponse"
          description: 登录成功
          headers:
            Set-Cookie:
              description: jingxuan_refresh; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Secure=false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求格式或参数类型错误
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 凭据或登录 challenge 无效
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 认证请求不是同源请求
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求参数校验失败
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 登录失败次数超限
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 服务器内部错误
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 登录保护依赖不可用
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未单独列出的错误响应
      security: []
      summary: 用户登录
      tags:
        - v1 认证
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: 注销成功
          headers:
            Set-Cookie:
              description: jingxuan_refresh; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Secure=false; Max-Age=0
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求格式或参数类型错误
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未认证或会话已过期
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 认证请求不是同源请求
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 服务器内部错误
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未单独列出的错误响应
      security:
        - BearerAuth: []
      summary: 注销当前会话
      tags:
        - v1 认证
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      responses:
        "204":
          description: 全部会话已注销
          headers:
            Set-Cookie:
              description: jingxuan_refresh; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Secure=false; Max-Age=0
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求格式或参数类型错误
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未认证或会话已过期
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 已认证但无权执行此操作
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 服务器内部错误
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未单独列出的错误响应
      security:
        - BearerAuth: []
      summary: 注销当前账号的全部会话
      tags:
        - v1 认证
  /api/v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/V1UserInfo"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求格式或参数类型错误
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未认证或会话已过期
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 已认证但无权执行此操作
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 服务器内部错误
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未单独列出的错误响应
      security:
        - BearerAuth: []
      summary: 获取当前用户
      tags:
        - v1 认证
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      responses:
        "200":
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/V1LoginResponse"
          description: 刷新成功
          headers:
            Set-Cookie:
              description: jingxuan_refresh; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Secure=false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 请求格式或参数类型错误
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 用户名、密码或刷新令牌无效
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 认证请求不是同源请求
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 服务器内部错误
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: 未单独列出的错误响应
      security: []
      summary: 轮换刷新令牌
      tags:
        - v1 认证
  /api/v1/auth/registrations:
    post:
      operationId: register
      requestBody:
        content:
