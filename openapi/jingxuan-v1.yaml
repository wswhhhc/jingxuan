components:
  schemas:
    LoginRequest:
      description: 登录请求
      properties:
        password:
          description: 密码
          example: '123456'
          minLength: 1
          type: string
        rememberMe:
          description: 记住登录状态（7天）
          example: false
          type: boolean
        username:
          description: 用户名
          example: student001
          minLength: 1
          type: string
      required:
      - password
      - username
      type: object
    ProblemDetails:
      description: 统一 API 错误响应
      properties:
        code:
          description: 机器可读业务错误码
          type: string
        detail:
          description: 面向用户的错误详情
          type: string
        fieldErrors:
          additionalProperties:
            type: string
          description: 字段校验错误（键为字段名，值为错误消息）
          type: object
        instance:
          description: 请求实例 URI
          type: string
        requestId:
          description: 请求追踪 ID
          type: string
        status:
          description: HTTP 状态码
          format: int32
          type: integer
        title:
          description: 问题标题
          type: string
        type:
          description: 问题类型 URI
          type: string
      required:
      - code
      - detail
      - fieldErrors
      - instance
      - requestId
      - status
      - title
      - type
      type: object
    ScoreSubmitRequest:
      description: 评分提交请求
      properties:
        comment:
          description: 教师评语
          type: string
        completion:
          description: 完成度（满分30）
          maximum: 30.0
          minimum: 0.0
          type: number
        difficulty:
          description: 技术难度（满分25）
          maximum: 25.0
          minimum: 0.0
          type: number
        innovation:
          description: 创新性（满分25）
          maximum: 25.0
          minimum: 0.0
          type: number
        practicality:
          description: 实用性（满分20）
          maximum: 20.0
          minimum: 0.0
          type: number
        workId:
          description: 作品ID
          type: string
      required:
      - completion
      - difficulty
      - innovation
      - practicality
      - workId
      type: object
    V1AdminComment:
      properties:
        content:
          type: string
        createdAt:
          type: string
        guestName:
          type: string
        id:
          type: string
        parentId:
          type: string
        replyToUserName:
          type: string
        roleName:
          type: string
        userId:
          type: string
        userName:
          type: string
        workId:
          type: string
        workTitle:
          type: string
      type: object
    V1AiImportMessage:
      description: AI 导入对话消息
      properties:
        content:
          type: string
        role:
          type: string
      type: object
    V1AiUserImportRequest:
      description: AI 解析批量导入用户请求
      properties:
        messages:
          items:
            $ref: '#/components/schemas/V1AiImportMessage'
          type: array
      type: object
    V1AiUserImportResponse:
      description: AI 解析批量导入用户响应
      properties:
        assistantReply:
          type: string
        assumptions:
          items:
            type: string
          type: array
        missingFields:
          items:
            type: string
          type: array
        optionalFields:
          items:
            type: string
          type: array
        ready:
          type: boolean
        requiredFields:
          items:
            type: string
          type: array
        userCount:
          format: int32
          type: integer
      type: object
    V1AuditDecisionRequest:
      properties:
        decision:
          minLength: 1
          type: string
        reason:
          maxLength: 500
          minLength: 0
          type: string
      required:
      - decision
      type: object
    V1Batch:
      properties:
        endAt:
          type: string
        id:
          type: string
        name:
          type: string
        rankPublished:
          type: boolean
        startAt:
          type: string
        status:
          type: string
      type: object
    V1BatchDetail:
      properties:
        classScopes:
          type: string
        createdAt:
          format: date-time
          type: string
        endAt:
          type: string
        id:
          type: string
        name:
          type: string
        noticeContent:
          type: string
        noticeTitle:
          type: string
        rankPublished:
          type: boolean
        startAt:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    V1BatchImportResult:
      properties:
        errors:
          items:
            type: string
          type: array
        failed:
          format: int32
          type: integer
        success:
          format: int32
          type: integer
      type: object
    V1BatchPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/V1BatchDetail'
          type: array
        page:
          $ref: '#/components/schemas/V1PageInfo'
      type: object
    V1BatchRequest:
      properties:
        batchName:
          minLength: 1
          type: string
        batchType:
          type: string
        classScopes:
          type: string
        endTime:
          type: string
        startTime:
          type: string
      required:
      - batchName
      type: object
    V1BatchScoreDetail:
      description: 批次作品评分明细
      properties:
        scores:
          items:
            $ref: '#/components/schemas/V1TeacherScoreItem'
          type: array
        submitterName:
          type: string
        workId:
          type: string
        workTitle:
          type: string
      type: object
    V1ChartData:
      description: 仪表盘图表数据
      properties:
        scoreDistribution:
          description: 评分分布
        statusDistribution:
          additionalProperties:
            type: string
          description: 作品状态分布
          type: object
        techStackDistribution:
          description: 技术栈分布
          items:
            additionalProperties: {}
            type: object
          type: array
      type: object
    V1CompleteTaskRequest:
      properties:
        workId:
          minLength: 1
          pattern: '[0-9]{1,19}'
          type: string
      required:
      - workId
      type: object
    V1CreateCommentRequest:
      properties:
        content:
          maxLength: 1000
          minLength: 0
          type: string
        guestName:
          maxLength: 50
          minLength: 0
          type: string
        parentId:
          pattern: '[0-9]{1,19}'
          type: string
      required:
      - content
      type: object
    V1CreateWorkRequest:
      properties:
        advisor:
          type: string
        attachmentIds:
          items:
            pattern: '[0-9]{1,19}'
            type: string
          type: array
        batchId:
          pattern: '[0-9]{1,19}'
          type: string
        coverUrl:
          type: string
        members:
          items:
            $ref: '#/components/schemas/WorkMemberDTO'
          type: array
        previewUrl:
          type: string
        runDescription:
          type: string
        summary:
          type: string
        techStack:
          type: string
        title:
          maxLength: 200
          minLength: 0
          type: string
      required:
      - title
      type: object
    V1CreatedComment:
      properties:
        id:
          type: string
      type: object
    V1CreatedDeletionRequest:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    V1CreatedWork:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    V1DashboardStats:
      description: 仪表盘统计
      properties:
        activeBatches:
          description: 活跃批次
          format: int64
          type: integer
        pendingAudit:
          description: 待审核数
          format: int64
          type: integer
        publishedWorks:
          description: 已发布数
          format: int64
          type: integer
        recentWorks:
          description: 近期作品
          items:
            additionalProperties: {}
            type: object
          type: array
        scoreDistribution:
          additionalProperties: {}
          description: 评分分布
          type: object
        totalStudents:
          description: 学生总数
          format: int64
          type: integer
        totalTeachers:
          description: 教师总数
          format: int64
          type: integer
        totalWorks:
          description: 作品总数
          format: int64
          type: integer
      type: object
    V1DeleteRequest:
      properties:
        reason:
          maxLength: 500
          minLength: 0
          type: string
      required:
