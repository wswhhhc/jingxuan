      description: 分页查询操作日志，支持按操作类型和用户 ID 筛选
      operationId: listLogs
      parameters:
      - description: 页码
        in: query
        name: page
        required: false
        schema:
          default: 1
          format: int32
          type: integer
      - description: 每页条数
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
      - description: 操作类型筛选
        in: query
        name: action
        required: false
        schema:
          type: string
      - description: 用户 ID
        in: query
        name: userId
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/V1PageV1LogEntry'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: 未提供有效身份凭证
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: 当前身份无权执行该操作
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Not Found
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: 请求方法不受支持
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: 无法生成客户端可接受的响应格式
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: 请求内容未通过业务校验
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal Server Error
