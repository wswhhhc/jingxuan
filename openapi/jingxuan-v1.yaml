        batchId:
          type: string
        coverUrl:
          type: string
        featured:
          type: boolean
        id:
          type: string
        likeCount:
          format: int32
          type: integer
        liked:
          type: boolean
        members:
          items:
            $ref: '#/components/schemas/V1WorkMember'
          type: array
        previewUrl:
          type: string
        publicationStatus:
          type: string
        rank:
          format: int32
          type: integer
        runDescription:
          type: string
        status:
