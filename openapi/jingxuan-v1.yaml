components:
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: '输入 Bearer Token，格式: Bearer {token}'
      scheme: bearer
      type: http
  schemas:
    LoginRequest:
      description: 登录请求
      properties:
        challengeAnswer:
          description: 登录风控要求 challenge 时填写的答案
          example: 7
          format: int32
          maximum: 100
          minimum: 0
          type: integer
        challengeId:
          description: 登录风控要求 challenge 时填写的 ID
          example: AAAAAAAAAAAAAAAAAAAAAA
          pattern: '[A-Za-z0-9_-]{22}'
          type: string
        password:
          description: 密码
          example: ExamplePass2026
          minLength: 1
          type: string
        rememberMe:
          description: 记住登录状态（30天）
          example: false
          type: boolean
        username:
          description: 用户名
          example: student001
          minLength: 1
          type: string
      required:
      - password
      - username
      type: object
    ProblemDetails:
      description: 统一 API 错误响应
      properties:
        code:
          description: 机器可读业务错误码
          type: string
        detail:
          description: 面向用户的错误详情
          type: string
        fieldErrors:
          additionalProperties:
            description: 字段校验错误
            type: string
          description: 字段校验错误
          type: object
        instance:
          description: 请求实例 URI
          format: uri-reference
          type: string
        requestId:
          description: 请求追踪 ID
          type: string
        status:
          description: HTTP 状态码
          format: int32
          type: integer
        title:
          description: 问题标题
          type: string
        type:
          description: 问题类型 URI
          format: uri
          type: string
      required:
      - code
      - detail
      - instance
      - requestId
      - status
      - title
      - type
      type: object
    ScoreSubmitRequest:
      description: 评分提交请求
      properties:
        comment:
          description: 教师评语
          type: string
        completion:
          description: 完成度（满分30）
          maximum: 30
          minimum: 0
          type: number
        difficulty:
          description: 技术难度（满分25）
          maximum: 25
          minimum: 0
          type: number
        innovation:
          description: 创新性（满分25）
          maximum: 25
          minimum: 0
          type: number
        practicality:
          description: 实用性（满分20）
          maximum: 20
          minimum: 0
          type: number
        workId:
          description: 作品ID
          type: string
      required:
      - completion
      - difficulty
      - innovation
      - practicality
      - workId
      type: object
    V1AuditDecisionRequest:
      properties:
        decision:
          minLength: 1
          type: string
        reason:
          maxLength: 500
          minLength: 0
          type: string
      required:
      - decision
      type: object
    V1Batch:
      properties:
        endAt:
          type: string
        id:
          type: string
        name:
          type: string
        rankPublished:
          type: boolean
        startAt:
          type: string
        status:
          type: string
      type: object
    V1ChallengeRequest:
      description: 创建一次性算术 challenge 请求
      properties:
        purpose:
          description: challenge 用途
          enum:
          - LOGIN
          - GUEST_COMMENT
          example: LOGIN
          type: string
      required:
      - purpose
      type: object
    V1ChallengeResponse:
      description: 一次性算术 challenge；答案仅保存在服务端
      properties:
        expiresIn:
          description: 剩余有效时间（秒）
          example: 300
          format: int64
          type: integer
        id:
          description: 128-bit URL-safe challenge ID
          example: AAAAAAAAAAAAAAAAAAAAAA
          type: string
        question:
          description: 简单加减法题目
          example: 3 + 4 = ?
          type: string
      type: object
    V1CompleteTaskRequest:
      properties:
        workId:
          minLength: 1
          pattern: '[0-9]{1,19}'
          type: string
      required:
      - workId
      type: object
    V1CreateCommentRequest:
      properties:
        content:
          maxLength: 1000
          minLength: 0
          type: string
        guestName:
          maxLength: 50
          minLength: 0
          type: string
        parentId:
          pattern: '[0-9]{1,19}'
          type: string
      required:
      - content
      type: object
    V1CreatedComment:
      properties:
        id:
          type: string
      type: object
    V1CreatedDeletionRequest:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    V1CreatedWork:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    V1CreateWorkRequest:
      properties:
        advisor:
          type: string
        attachmentIds:
          items:
            pattern: '[0-9]{1,19}'
            type: string
          type: array
        batchId:
          pattern: '[0-9]{1,19}'
          type: string
        coverUrl:
          type: string
        members:
          items:
            $ref: '#/components/schemas/WorkMemberDTO'
          type: array
        previewUrl:
          type: string
        runDescription:
          type: string
        summary:
          type: string
        techStack:
          type: string
        title:
          maxLength: 200
          minLength: 0
          type: string
      required:
      - title
      type: object
    V1DeleteRequest:
      properties:
        reason:
          maxLength: 500
          minLength: 0
          type: string
      required:
      - reason
      type: object
    V1DeletionImpact:
      properties:
        referenceCount:
          format: int64
          type: integer
        references:
          items:
            type: string
          type: array
        resourceId:
          type: string
        resourceType:
          type: string
      type: object
    V1EmailVerificationRequest:
      properties:
        email:
          format: email
          minLength: 1
          type: string
        roleId:
          pattern: 1|2
          type: string
      required:
      - email
      - roleId
      type: object
    V1FeaturedRequest:
      properties:
        featured:
          type: boolean
        previewUrl:
          type: string
      required:
      - featured
      type: object
    V1LoginResponse:
      properties:
        accessToken:
          type: string
        expiresIn:
          format: int64
          type: integer
        tokenType:
          type: string
        user:
          $ref: '#/components/schemas/V1UserInfo'
      required:
      - accessToken
      - expiresIn
      - tokenType
      - user
      type: object
    V1ReferenceItem:
      properties:
        id:
          type: string
        label:
          type: string
        sort:
          format: int32
          type: integer
        type:
          type: string
        value:
          type: string
      type: object
    V1RegistrationRequest:
      properties:
        classId:
          type: string
        email:
          format: email
          minLength: 1
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
        realName:
          maxLength: 64
          minLength: 0
          type: string
        roleId:
          pattern: 1|2
          type: string
        username:
          maxLength: 64
          minLength: 0
          type: string
        verifyCode:
          minLength: 1
          pattern: '[0-9]{6}'
          type: string
      required:
      - email
      - password
      - realName
      - roleId
      - username
      - verifyCode
      type: object
    V1SubmitWorkRequest:
      properties:
        taskId:
          pattern: '[0-9]{1,19}'
          type: string
      type: object
    V1Tag:
      properties:
        color:
          type: string
        id:
          type: string
        name:
          type: string
        sort:
          format: int32
          type: integer
        type:
          type: string
      type: object
    V1TagRequest:
      properties:
        color:
          pattern: '#[0-9A-Fa-f]{6}'
          type: string
        name:
          maxLength: 64
          minLength: 0
          type: string
        sort:
          format: int32
          type: integer
        type:
          minLength: 1
          pattern: '[A-Za-z0-9_-]{1,64}'
          type: string
      required:
      - name
      - type
      type: object
    V1Task:
      properties:
        batchId:
          type: string
        batchName:
          type: string
        content:
          type: string
        endAt:
          type: string
        id:
          type: string
        status:
          type: string
        title:
          type: string
        workId:
          type: string
      type: object
    V1UpdateWorkRequest:
      properties:
        advisor:
          type: string
        attachmentIds:
          items:
            pattern: '[0-9]{1,19}'
            type: string
          type: array
        coverUrl:
          type: string
        members:
          items:
            $ref: '#/components/schemas/WorkMemberDTO'
          type: array
        previewUrl:
          type: string
        runDescription:
          type: string
        summary:
          type: string
        techStack:
          type: string
        title:
          maxLength: 200
          minLength: 0
          type: string
      type: object
    V1UserApprovalDecisionRequest:
      properties:
        decision:
          pattern: APPROVED|REJECTED
          type: string
        reason:
          maxLength: 500
          minLength: 0
          type: string
      type: object
    V1UserDeletionImpact:
      properties:
        deletionBlocked:
          type: boolean
        referenceCount:
          format: int64
          type: integer
        references:
          items:
            type: string
          type: array
        resourceId:
          type: string
        resourceType:
          type: string
      type: object
    V1UserInfo:
      properties:
        avatar:
          type: string
        classId:
          type: string
        className:
          type: string
        email:
          type: string
        firstLogin:
          type: boolean
        id:
          type: string
        phone:
          type: string
        realName:
          type: string
        roleCode:
          type: string
        roleId:
          type: string
        roleName:
          type: string
        username:
          type: string
      type: object
    V1WorkAttachment:
      properties:
        category:
          type: string
        contentType:
          type: string
        fileName:
          type: string
        id:
          type: string
        size:
          format: int64
          type: integer
        url:
          type: string
      type: object
    V1WorkDetail:
      properties:
        advisor:
          type: string
        attachments:
          items:
            $ref: '#/components/schemas/V1WorkAttachment'
